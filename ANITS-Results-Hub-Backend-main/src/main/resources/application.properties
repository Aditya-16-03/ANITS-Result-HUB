# ===== Upload size limits (for PDF + the remaining Excel uploaders) =====
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===== Results PDF -> n8n webhook (Flow A) =====
# Spring Boot POSTs the uploaded PDF to this n8n webhook; n8n responds with the results JSON.
# Set this to your n8n production webhook URL (or ngrok URL). Leave blank to disable.
n8n.webhook.url=https://aditya-16-03.app.n8n.cloud/webhook-test/anits-results
# Connect/read timeout (ms) for the call to n8n (PDF parsing can be slow).
n8n.webhook.timeout-ms=120000
